# fly.toml app configuration file generated for reeler-bot on 2026-11-14T18:09:15+05:30
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'reeler-bot'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
