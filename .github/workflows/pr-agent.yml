name: Qodo PR-Agent Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: >-
      ((github.event_name == 'pull_request') ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/'))) &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Check API key availability
        id: check_keys
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ] || [ -n "${{ secrets.OPENAI_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::PR-Agent skipped: neither GEMINI_API_KEY nor OPENAI_KEY is configured in GitHub repository secrets."
          fi

      - name: Checkout Code
        if: steps.check_keys.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Run PR-Agent Action
        if: steps.check_keys.outputs.has_key == 'true'
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: "gemini/gemini-2.0-flash"
          config.fallback_models: '["gemini/gemini-1.5-flash", "gemini/gemini-1.5-pro"]'
          config.custom_model_max_tokens: "32000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
