version: 2
updates:
  # npm dependencies: security-only (routine version bumps disabled; security updates enabled)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 0

  # GitHub Actions: security-only (routine version bumps disabled; security updates enabled)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 0
