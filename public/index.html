<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reeler — Saved Reels Vault</title>
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <div class="app-layout">
    <!-- Top Command Navigation -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="vault-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="3"></rect>
            <path d="M7 2v20"></path>
            <path d="M17 2v20"></path>
            <path d="M2 12h20"></path>
            <path d="M2 7h5"></path>
            <path d="M2 17h5"></path>
            <path d="M17 17h5"></path>
            <path d="M17 7h5"></path>
          </svg>
        </div>
        <div class="vault-identity">
          <h1 class="vault-brand">REELER</h1>
          <div class="vault-tag">Personal Saved Reels Vault</div>
        </div>
      </div>

      <div class="nav-right">
        <div id="db-badge" class="nav-badge">
          <span class="badge-dot" aria-hidden="true"></span>
          <span class="badge-label">Checking DB...</span>
        </div>
        <input type="file" id="archive-file-input" accept=".json" style="display: none;" />
        <button id="import-btn" class="nav-btn nav-btn-primary" title="Import official Instagram saved_posts.json export">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Import Archive</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <div class="vault-container">
      <!-- Stats Overview Bar -->
      <section class="stats-bar" aria-label="Library Overview">
        <h2 class="sr-only">Library Overview</h2>
        <div class="metric-cell">
          <span class="metric-label">TOTAL REELS</span>
          <span class="metric-num" id="stat-total">0</span>
        </div>
        <div class="metric-cell">
          <span class="metric-label">ACTIVE CREATORS</span>
          <span class="metric-num" id="stat-creators">0</span>
        </div>
        <div class="metric-cell">
          <span class="metric-label">SAVED THIS WEEK</span>
          <span class="metric-num" id="stat-week">0</span>
        </div>
        <div class="metric-cell metric-cell-accent">
          <span class="metric-label">WATCH LATER</span>
          <span class="metric-num metric-accent" id="stat-watch-later">0</span>
        </div>
      </section>

      <!-- Filter & Search Toolbar -->
      <section class="toolbar-section" aria-label="Search and filter controls">
        <div class="search-field">
          <svg class="search-glyph" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search keywords in captions or creators..." autocomplete="off">
          <button id="clear-search" class="clear-search-btn" aria-label="Clear search" style="display: none;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="filters-row">
          <div class="select-wrapper">
            <select id="date-preset" aria-label="Filter by date">
              <option value="all">Date: All Time</option>
              <option value="today">Date: Today</option>
              <option value="yesterday">Date: Yesterday</option>
              <option value="7d">Date: Last 7 Days</option>
              <option value="30d">Date: Last 30 Days</option>
              <option value="3m">Date: Last 3 Months</option>
              <option value="6m">Date: Last 6 Months</option>
              <option value="year">Date: This Year</option>
            </select>
          </div>

          <div class="select-wrapper">
            <select id="watch-filter" aria-label="Filter by watch status">
              <option value="all">Status: All</option>
              <option value="unwatched">Status: Unwatched</option>
              <option value="watch_later">Status: Watch Later</option>
              <option value="watched">Status: Watched</option>
            </select>
          </div>

          <div class="select-wrapper">
            <select id="sort-by" aria-label="Sort reels">
              <option value="newest_saved">Sort: Newest Saved</option>
              <option value="oldest_saved">Sort: Oldest Saved</option>
              <option value="newest_published">Sort: Newest Published</option>
              <option value="oldest_published">Sort: Oldest Published</option>
            </select>
          </div>

          <!-- View Mode Toggle: Grid vs Table -->
          <div class="view-mode-toggle" role="group" aria-label="View Mode">
            <button id="view-mode-grid" class="view-btn active" title="Poster Grid View" aria-label="Grid View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
              </svg>
            </button>
            <button id="view-mode-list" class="view-btn" title="Dense Table / List View" aria-label="List View">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Creator Quick-Filter Strip -->
      <section class="creators-strip-container" aria-label="Filter by creator">
        <div class="strip-header">
          <h2 class="strip-caption">TOP CREATORS</h2>
          <button id="reset-creator-btn" class="strip-reset-btn" style="display: none;">Show All</button>
        </div>
        <div class="creators-scroll-track" id="creator-pills-list">
          <button class="creator-chip active" data-creator-id="">All Creators</button>
        </div>
      </section>

      <!-- Main Reels Presentation View -->
      <main class="library-main">
        <h2 class="sr-only">Saved Reels Catalog</h2>
        <div class="library-header-meta">
          <div id="results-count" class="results-counter" aria-live="polite">Loading reels...</div>
        </div>

        <!-- Visual Poster Grid Container -->
        <div class="reels-grid-canvas" id="reels-grid">
          <!-- Populated by app.js -->
        </div>

        <!-- Dense Table / List Container (hidden by default) -->
        <div class="reels-table-canvas" id="reels-table-container" style="display: none;">
          <table class="dense-table" id="reels-table">
            <thead>
              <tr>
                <th style="width: 70px;">RANK</th>
                <th style="width: 180px;">CREATOR</th>
                <th>LOGLINE / CAPTION</th>
                <th style="width: 120px;">SAVED DATE</th>
                <th style="width: 120px;">STATUS</th>
                <th style="width: 140px; text-align: right;">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="reels-table-body">
              <!-- Populated by app.js -->
            </tbody>
          </table>
        </div>

        <!-- Pagination Bar -->
        <div class="pagination-footer" id="pagination-bar" style="display: none;">
          <button id="prev-page-btn" class="nav-btn nav-btn-secondary">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Previous</span>
          </button>
          <span id="page-indicator" class="page-count-text">Page 1 of 1</span>
          <button id="next-page-btn" class="nav-btn nav-btn-secondary">
            <span>Next</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </main>
    </div>

    <!-- Fullscreen Instagram Reels / TikTok Style Vertical Snap-Feed -->
    <div id="reels-feed-modal" class="reels-feed-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="feed-modal-title">
      <!-- Top HUD Bar -->
      <div class="feed-top-bar">
        <h2 class="sr-only" id="feed-modal-title">Reels Vertical Stream</h2>
        <div class="feed-counter-wrap">
          <span class="feed-counter-kicker" id="feed-counter-kicker">REEL 1 OF 1</span>
          <span class="feed-shortcode-tag" id="feed-shortcode-tag">ID: ...</span>
        </div>
        <div class="feed-top-actions">
          <button class="feed-nav-arrow-btn" id="feed-arrow-up" aria-label="Previous reel" title="Previous reel (↑ or k)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </button>
          <button class="feed-nav-arrow-btn" id="feed-arrow-down" aria-label="Next reel" title="Next reel (↓ or j)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <button class="feed-close-btn" id="feed-close-btn" aria-label="Close reels feed" title="Close feed (Esc)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      </div>

      <!-- Vertical Snap Scroll Track -->
      <div class="feed-scroll-track" id="feed-scroll-track" tabindex="-1">
        <!-- Rendered dynamically as .feed-reel-slide elements -->
      </div>
    </div>
  </div>

  <script src="app.js?v=2.1"></script>
</body>
</html>
