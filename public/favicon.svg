<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14171f"/>
      <stop offset="50%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="480" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2330" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas (Meta requires solid square, no alpha) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Subtle obsidian frame accent -->
  <rect x="32" y="32" width="960" height="960" rx="48" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2"/>

  <!-- Centered Reeler Film Vault Symbol (scaled 24x from 24x24 viewBox) -->
  <!-- Target width: 576, height: 576, offset: (1024 - 576) / 2 = 224 -->
  <g transform="translate(224, 224) scale(24)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <rect x="2" y="2" width="20" height="20" rx="3" fill="#121419" fill-opacity="0.4"/>
    <path d="M7 2v20"/>
    <path d="M17 2v20"/>
    <path d="M2 12h20"/>
    <path d="M2 7h5"/>
    <path d="M2 17h5"/>
    <path d="M17 17h5"/>
    <path d="M17 7h5"/>
  </g>
</svg>
