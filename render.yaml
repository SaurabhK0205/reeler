services:
  - type: web
    name: reeler-staging
    runtime: docker
    plan: free
    region: oregon
    branch: staging
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: ALLOW_INSECURE_WEBHOOK
        value: "false"
      - key: ADMIN_USERNAME
        value: sybaurabh
      - key: DEFAULT_REMINDER_HOURS
        value: "10"
      - key: DM_POLLING_SECONDS
        value: "15"
      - key: TZ
        value: "UTC"
      - key: APP_TIMEZONE
        value: "UTC"
      - key: APP_URL
        value: "https://reeler-staging.onrender.com"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_SESSION_ID
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_CSRF_TOKEN
        sync: false
